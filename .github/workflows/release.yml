name: Release Standalone Binary

on:
  schedule:
    # Run weekly every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.0 or nightly-YYYYMMDD)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS ARM64 Standalone Binary
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: |
          brew install cmake ninja freetype ffmpeg

      - name: Compile 3rdparty and build standalone binary
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run verification tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Package release artifact
        id: package
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              VERSION="${GITHUB_REF#refs/tags/}"
            else
              VERSION="nightly-$(date +'%Y%m%d')"
            fi
          fi
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

          tar -czvf ps4-recomp-macos-arm64.tar.gz -C bin ps4-recomp
          shasum -a 256 ps4-recomp-macos-arm64.tar.gz > ps4-recomp-macos-arm64.tar.gz.sha256
          echo "Packaged artifact with SHA-256: $(cat ps4-recomp-macos-arm64.tar.gz.sha256)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: PS4Recomp ${{ steps.package.outputs.tag_name }}
          draft: false
          prerelease: ${{ startsWith(steps.package.outputs.tag_name, 'nightly') }}
          generate_release_notes: true
          files: |
            ps4-recomp-macos-arm64.tar.gz
            ps4-recomp-macos-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
